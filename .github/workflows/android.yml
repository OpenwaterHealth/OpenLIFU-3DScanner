name: Android CI

on:
  push:
    branches: [ "v0.5_arcore_cloud" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode service account json
      run: |
        echo "${{ secrets.FIREBASE_TOKEN_JSON }}" > $HOME/firebase.json

    - name: Set GOOGLE_APPLICATION_CREDENTIALS env
      run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase.json" >> $GITHUB_ENV

    - name: Install Firebase CLI
      run: |
        curl -sL https://firebase.tools | bash

    - name: Grant execute permission for gradlew
      run: chmod +x OpenLIFU-3DScanner/gradlew

    - name: Build with Gradle
      working-directory: OpenLIFU-3DScanner
      run: ./gradlew assembleRelease

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: OpenLIFU-3DScanner/app/build/outputs/apk/release/*.apk

    - name: Upload to Firebase App Distribution
      run: |
        firebase appdistribution:distribute \
          OpenLIFU-3DScanner/app/build/outputs/apk/release/app-release.apk \
          --app "1:341318872140:android:73e3bcd90afaba077b18e9" \
          --groups "testers" \
          --release-notes "Uploaded from GitHub Actions"
