name: Android CI

on:
  push:
    branches:
      - v0.7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x OpenLIFU-3DScanner/gradlew

      - name: Generate release notes from commits
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            NOTES=$(git log --pretty=format:"• %s" ${{ github.event.before }}..${{ github.sha }})
          else
            NOTES="• Initial release"
          fi
          mkdir -p OpenLIFU-3DScanner/app/src/main/play/release-notes/en-US
          echo "$NOTES" > OpenLIFU-3DScanner/app/src/main/play/release-notes/en-US/internal.txt

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > OpenLIFU-3DScanner/openwater.jks

      - name: Setup Play credentials
        working-directory: OpenLIFU-3DScanner
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > app/play-key.json

      - name: Build and publish to Google Play (Internal testing)
        working-directory: OpenLIFU-3DScanner
        run: ./gradlew publishReleaseBundle
